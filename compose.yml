services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: lumin
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: lumin
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ./first_time.sql:/docker-entrypoint-initdb.d/first_time.sql:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U lumin" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  bot:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      TOKEN: ${TOKEN}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_PORT: ${DB_PORT:-5432}
      DB_HOST: ${DB_HOST:-localhost}
    volumes:
      - .:/bot

volumes:
  postgres_data:
